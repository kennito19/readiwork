<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Login — Readiwork</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
:root{
  --brand:#6366f1;
  --brand-soft:#818cf8;
  --accent:#22c55e;
  --bg:#020617;
  --surface:#0b1220;
  --card:#111827;
  --text:#f1f5f9;
  --muted:#9ca3af;
  --border:#1f2937;
}

body{
  font-family:Inter,system-ui,sans-serif;
  background:
    radial-gradient(50% 40% at top, rgba(99,102,241,.25), transparent 60%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* LOGIN CARD */
.login-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:26px;
  padding:50px;
  max-width:420px;
  width:100%;
  box-shadow:0 40px 80px rgba(99,102,241,.25);
}

.brand{
  font-weight:900;
  letter-spacing:.5px;
}

.brand span{
  color:var(--brand-soft);
}

.form-control{
  background:#020617;
  border:1px solid var(--border);
  color:#fff;
  padding:14px 18px;
  border-radius:14px;
}

.form-control:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(99,102,241,.25);
  background:#020617;
  color:#fff;
}

.btn-primary{
  background:linear-gradient(135deg,var(--brand),var(--brand-soft));
  border:none;
  padding:14px;
  border-radius:999px;
  font-weight:600;
}

.admin-note{
  background:rgba(34,197,94,.12);
  border:1px solid rgba(34,197,94,.25);
  color:#bbf7d0;
  border-radius:14px;
  padding:12px;
  font-size:.9rem;
}

.small-link{
  color:var(--muted);
  text-decoration:none;
}
.small-link:hover{
  color:var(--accent);
}
</style>
</head>

<body>

<div class="login-card">

  <div class="text-center mb-4">
    <div class="brand fs-3">READI<span>WORK</span></div>
    <p class="text-muted mt-2">Admin Control Panel</p>
  </div>

  <div class="admin-note text-center mb-4">
    <i class="fa-solid fa-shield-halved me-1"></i>
    Restricted access — authorized personnel only
  </div>

  <form method="post" action="login.php">
    <div class="mb-3">
      <label class="form-label small text-muted">Admin Email</label>
      <input type="email" name="email" class="form-control" placeholder="admin@readiwork.com" required>
    </div>

    <div class="mb-4">
      <label class="form-label small text-muted">Password</label>
      <input type="password" name="password" class="form-control" placeholder="••••••••" required>
    </div>

    <!-- OPTIONAL OTP FIELD -->
    <!--
    <div class="mb-4">
      <label class="form-label small text-muted">2FA Code</label>
      <input type="text" name="otp" class="form-control" placeholder="123456">
    </div>
    -->

    <button class="btn btn-primary w-100">
      <i class="fa-solid fa-lock me-1"></i> Secure Login
    </button>
  </form>

  <div class="text-center mt-4">
    <a href="/" class="small-link">
      ← Back to Readiwork
    </a>
  </div>

</div>

</body>
</html>
